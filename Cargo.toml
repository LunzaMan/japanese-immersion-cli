[package]
name = "japanese-immersion-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
reqwest = "0.13.4"
tokio = {version = "1.52.3", features = ["macros", "rt-multi-thread"]}
rusqlite = { version = "0.40.1", features = ["bundled"] }
r2d2 = "0.8.10"
clap = { version = "4.6.1", features = ["derive"] }

